name: YES AND. — Refresh Ottawa development data

on:
  workflow_dispatch:
  schedule:
    # Daily, at 11:17 UTC (GitHub schedules may be delayed).
    - cron: '17 11 * * *'
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: yesand-pages
  cancel-in-progress: false

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build a complete, validated City snapshot
        run: python scripts/update_developments.py --output site/development-applications.json

      - name: Add your curated stories and homepage
        run: |
          cp stories.json site/stories.json
          cp index.html site/index.html
          touch site/.nojekyll
          python -m json.tool site/stories.json > /dev/null
          python -m json.tool site/development-applications.json > /dev/null

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the site files
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Publish to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

