
name: YES AND. - Refresh Ottawa development data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * *'
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: yesand-pages
  cancel-in-progress: false

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Retrieve Ottawa development data
        run: python scripts/update_developments.py --output site/development-applications.json

      - name: Include YES AND. stories
        run: |
          cp stories.json site/stories.json
          cp index.html site/index.html
          touch site/.nojekyll
          python -m json.tool site/stories.json > /dev/null
          python -m json.tool site/development-applications.json > /dev/null

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website data
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Publish to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
